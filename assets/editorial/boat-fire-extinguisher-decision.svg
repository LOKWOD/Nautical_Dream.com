<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Boat fire extinguisher decision framework</title>
  <desc id="desc">Four-step compliance diagram: identify the boat, count accepted ratings, mount for access and inspect by date and condition.</desc>
  <rect width="1600" height="900" fill="#f3efe4"/>
  <rect x="0" y="0" width="1600" height="185" fill="#071f30"/>
  <text x="100" y="92" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">FIRE GEAR: COUNT WHAT ACTUALLY COUNTS</text>
  <text x="100" y="142" font-family="Arial, sans-serif" font-size="25" fill="#b9d7e8">Exact boat → accepted rating → reachable location → serviceable unit</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="255" width="330" height="360" rx="22" fill="#e0ecea"/>
    <circle cx="145" cy="315" r="30" fill="#f26a2c"/><text x="145" y="325" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">1</text>
    <text x="125" y="395" font-size="34" font-weight="800" fill="#071f30">THE BOAT</text>
    <text x="125" y="445" font-size="23" fill="#173f4d">model year · length</text>
    <text x="125" y="480" font-size="23" fill="#173f4d">fuel tank · closed spaces</text>
    <text x="125" y="545" font-size="18" font-weight="700" fill="#28716d">Requirement begins here.</text>

    <rect x="455" y="255" width="330" height="360" rx="22" fill="#d6e4ef"/>
    <circle cx="510" cy="315" r="30" fill="#2b7596"/><text x="510" y="325" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">2</text>
    <text x="490" y="395" font-size="34" font-weight="800" fill="#071f30">THE COUNT</text>
    <text x="490" y="445" font-size="23" fill="#173f4d">5-B or 20-B</text>
    <text x="490" y="480" font-size="23" fill="#173f4d">fixed system verified</text>
    <text x="490" y="545" font-size="18" font-weight="700" fill="#2b7596">20-B can replace two 5-B.</text>

    <rect x="820" y="255" width="330" height="360" rx="22" fill="#f0dfbc"/>
    <circle cx="875" cy="315" r="30" fill="#d29a29"/><text x="875" y="325" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">3</text>
    <text x="855" y="395" font-size="34" font-weight="800" fill="#071f30">THE ACCESS</text>
    <text x="855" y="445" font-size="23" fill="#173f4d">correct bracket</text>
    <text x="855" y="480" font-size="23" fill="#173f4d">away from likely fire</text>
    <text x="855" y="545" font-size="18" font-weight="700" fill="#946817">Reach it without moving gear.</text>

    <rect x="1185" y="255" width="325" height="360" rx="22" fill="#e7d9d5"/>
    <circle cx="1240" cy="315" r="30" fill="#a84532"/><text x="1240" y="325" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">4</text>
    <text x="1220" y="395" font-size="34" font-weight="800" fill="#071f30">THE CHECK</text>
    <text x="1220" y="445" font-size="23" fill="#173f4d">date · seal · gauge</text>
    <text x="1220" y="480" font-size="23" fill="#173f4d">label · nozzle · corrosion</text>
    <text x="1220" y="545" font-size="16" font-weight="700" fill="#8d3b2c">Used or damaged means stop.</text>
  </g>
  <line x1="110" y1="705" x2="1490" y2="705" stroke="#89a2ac" stroke-width="3"/>
  <text x="800" y="778" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#071f30">THE RED CYLINDER IS NOT THE PROOF. THE EXACT LABEL IS.</text>
  <text x="800" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#345865">Original editorial diagram · not a product image or fire-response procedure</text>
</svg>
