<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Keuka Lake one-branch family plan</title><desc id="desc">Stylized Y-shaped lake planning diagram with launch, short west-branch route, lunch, weather check and early return.</desc>
  <defs><linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8ead7"/><stop offset="1" stop-color="#c9d8c5"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#land)"/><path d="M0 710c360-80 520 65 850-3s500-22 750 38v155H0z" fill="#aac7b1"/>
  <text x="90" y="102" fill="#07364b" font-family="Arial,sans-serif" font-size="58" font-weight="700">KEUKA: ONE BRANCH IS A FULL DAY</text><text x="92" y="148" fill="#39665e" font-family="Arial,sans-serif" font-size="26">Planning diagram—not a navigation chart</text>
  <g transform="translate(520 110)"><path d="M290 650C275 545 285 435 300 346 313 270 234 212 130 96" fill="none" stroke="#148ca0" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 346C363 267 426 201 540 91" fill="none" stroke="#148ca0" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 346C313 270 234 212 130 96" fill="none" stroke="#8ad9dd" stroke-width="18" stroke-linecap="round" stroke-dasharray="24 20"/><path d="M150 120c52 68 107 112 142 178" fill="none" stroke="#f0783b" stroke-width="14" stroke-linecap="round"/><path d="M292 298c-30-30-60-51-85-76" fill="none" stroke="#f0783b" stroke-width="14" stroke-linecap="round" stroke-dasharray="16 14"/>
  <circle cx="152" cy="120" r="30" fill="#fff" stroke="#f0783b" stroke-width="12"/><path d="M138 120h28m-14-14v28" stroke="#f0783b" stroke-width="8"/>
  <circle cx="217" cy="228" r="31" fill="#fff" stroke="#f0783b" stroke-width="12"/><path d="M201 224h32m-28 12h24" stroke="#f0783b" stroke-width="7"/>
  <circle cx="292" cy="298" r="34" fill="#07364b"/><path d="M282 285l20 13-20 13" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g font-family="Arial,sans-serif"><g transform="translate(80 260)"><rect width="350" height="112" rx="28" fill="#fff"/><text x="30" y="46" fill="#e76c32" font-size="22" font-weight="700">1 · LAUNCH EARLY</text><text x="30" y="80" fill="#07364b" font-size="23">Keuka Lake State Park</text></g><g transform="translate(80 410)"><rect width="350" height="112" rx="28" fill="#fff"/><text x="30" y="46" fill="#e76c32" font-size="22" font-weight="700">2 · SETTLE FIRST</text><text x="30" y="80" fill="#07364b" font-size="23">Ten calm minutes</text></g><g transform="translate(1150 250)"><rect width="360" height="112" rx="28" fill="#fff"/><text x="30" y="46" fill="#e76c32" font-size="22" font-weight="700">3 · ONE EXTENSION</text><text x="30" y="80" fill="#07364b" font-size="23">Not the whole Y</text></g><g transform="translate(1150 400)"><rect width="360" height="112" rx="28" fill="#fff"/><text x="30" y="46" fill="#e76c32" font-size="22" font-weight="700">4 · EAT EARLY</text><text x="30" y="80" fill="#07364b" font-size="23">Before family fatigue</text></g><g transform="translate(1150 550)"><rect width="360" height="112" rx="28" fill="#07364b"/><text x="30" y="46" fill="#8ed9dc" font-size="22" font-weight="700">5 · RETURN</text><text x="30" y="80" fill="#fff" font-size="23">Before wind stacks up</text></g></g>
  <text x="90" y="818" fill="#07364b" font-family="Arial,sans-serif" font-size="29" font-weight="700">Name the branch. Name the turnaround. Keep the shore backup.</text>
</svg>
