<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Anchor rode compatibility system</title><desc id="d">A diagram tracing the anchor load path through shackle, chain, nylon line, bow roller, windlass and deck strong point.</desc><rect width="1600" height="900" fill="#06283b"/><path d="M0 650 Q360 610 710 670 T1600 645 V900 H0Z" fill="#0b6f86"/><path d="M0 705 Q360 665 710 725 T1600 700" fill="none" stroke="#64d7e8" stroke-width="9" opacity=".6"/><text x="80" y="105" fill="#fff" font-family="Arial,sans-serif" font-size="56" font-weight="700">THE RODE IS ONE LOAD PATH</text><text x="82" y="158" fill="#9bd9e4" font-family="Arial,sans-serif" font-size="27">Every transition must match the boat, anchor, windlass and expected load.</text><g font-family="Arial,sans-serif" text-anchor="middle"><path d="M180 570 l65 0 22 70-35 70h-75l-35-70z" fill="#f0ad4e" stroke="#fff" stroke-width="5"/><text x="195" y="760" fill="#fff" font-size="27" font-weight="700">ANCHOR</text><circle cx="350" cy="570" r="44" fill="#d8e3e8" stroke="#fff" stroke-width="5"/><text x="350" y="580" fill="#06283b" font-size="22" font-weight="700">PIN</text><text x="330" y="650" fill="#fff" font-size="24" font-weight="700">SHACKLE</text><path d="M395 570 H650" fill="none" stroke="#c9d3d8" stroke-width="28" stroke-dasharray="28 18"/><text x="550" y="650" fill="#fff" font-size="24" font-weight="700">MATCHED CHAIN</text><path d="M650 570 C760 500 820 640 930 570 S1100 500 1195 570" fill="none" stroke="#f2c879" stroke-width="22"/><text x="925" y="650" fill="#fff" font-size="24" font-weight="700">NYLON + SPLICE</text><path d="M1195 570 l85-85 100 30-30 75-120 0z" fill="#e9f2f5"/><circle cx="1310" cy="500" r="48" fill="#123f55" stroke="#54c7d9" stroke-width="10"/><text x="1265" y="650" fill="#fff" font-size="22" font-weight="700">GYPSY + ROLLER</text><rect x="1395" y="460" width="115" height="130" rx="18" fill="#f0ad4e"/><text x="1450" y="510" fill="#06283b" font-size="20" font-weight="700">STRONG</text><text x="1450" y="540" fill="#06283b" font-size="20" font-weight="700">POINT</text><text x="1465" y="685" fill="#fff" font-size="22" font-weight="700">SECURE LOAD</text></g><rect x="80" y="790" width="1440" height="3" fill="#9bd9e4" opacity=".5"/><text x="800" y="842" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">SIZE • FIT • INSPECT • DEPLOY • TRANSFER THE LOAD OFF THE WINDLASS</text></svg>
