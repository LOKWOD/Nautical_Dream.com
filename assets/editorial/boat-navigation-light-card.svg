<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Boat navigation light guide card</title><desc id="desc">Small powerboat silhouette with red, green and white navigation lights against a dark night-water background.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#041722"/><stop offset="1" stop-color="#0d5364"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="18"/></filter></defs>
  <rect width="1200" height="900" fill="url(#bg)"/><path d="M0 655q190-45 370 0t370 0t460 0v245H0z" fill="#0b657a" opacity=".65"/>
  <path d="M600 215Q800 345 850 650L745 745H455L350 650Q400 345 600 215Z" fill="#eaf4f2" stroke="#eaf4f2" stroke-width="11" stroke-linejoin="round"/><path d="M600 250V710M465 430H735" stroke="#0d5364" stroke-width="10" opacity=".4"/>
  <g filter="url(#g)"><circle cx="430" cy="420" r="65" fill="#e34e4d"/><circle cx="770" cy="420" r="65" fill="#51d99a"/><circle cx="600" cy="650" r="76" fill="#fff5c4"/></g><circle cx="430" cy="420" r="20" fill="#f25854"/><circle cx="770" cy="420" r="20" fill="#56e3a3"/><circle cx="600" cy="650" r="22" fill="#fff9dd"/>
  <text x="75" y="105" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#f6fbfa" letter-spacing="4">PATTERN FIRST</text><text x="75" y="150" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#b9dade">PORTABLE OR HARDWIRED</text>
</svg>
