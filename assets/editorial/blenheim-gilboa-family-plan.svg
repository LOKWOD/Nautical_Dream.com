<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Blenheim-Gilboa Lower Reservoir family boating sequence</title><desc id="desc">A five-step illustrated route from Mine Kill State Park through a hot-water boat wash, sign-in, a short reservoir loop, early recovery, and a second wash.</desc>
  <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d7eee9"/><stop offset="1" stop-color="#8bc6c3"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#sky)"/><path d="M0 435L250 210l185 190 180-240 235 250 205-280 280 300 265-190v310H0z" fill="#456d60"/><path d="M0 540q240-85 455-10t405 0t400 0t340 10v360H0z" fill="#18738a"/>
  <path d="M225 665Q470 510 720 635T1180 610" fill="none" stroke="#e8c86b" stroke-width="12" stroke-dasharray="18 16"/>
  <g font-family="Arial,Helvetica,sans-serif"><text x="80" y="95" font-size="34" font-weight="700" fill="#082c38" letter-spacing="3">THE MANDATORY-WASH FAMILY DAY</text><text x="80" y="142" font-size="23" fill="#214a50">Lower reservoir · Mine Kill State Park · 2026 process</text></g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g transform="translate(180 650)"><circle r="72" fill="#f7faf4" stroke="#0c5364" stroke-width="6"/><path d="M-28 16h56l-8 22h-40zM0-32v48" fill="none" stroke="#0c5364" stroke-width="7"/><text y="110" font-size="21" font-weight="700" fill="#062b38">1 · ARRIVE</text></g><g transform="translate(480 555)"><circle r="72" fill="#f7faf4" stroke="#0c5364" stroke-width="6"/><path d="M-28-22q28-30 56 0M-22 0q22-25 44 0M0 10v30" fill="none" stroke="#0b80a0" stroke-width="7"/><text y="110" font-size="21" font-weight="700" fill="#062b38">2 · HOT WASH</text></g><g transform="translate(790 670)"><circle r="72" fill="#f7faf4" stroke="#0c5364" stroke-width="6"/><path d="M-27-34h54v68h-54zM-15-12h30M-15 3h30M-15 18h20" fill="none" stroke="#0c5364" stroke-width="6"/><text y="110" font-size="21" font-weight="700" fill="#062b38">3 · SIGN IN</text></g><g transform="translate(1090 555)"><circle r="72" fill="#f7faf4" stroke="#0c5364" stroke-width="6"/><path d="M-37 7h74l-12 25h-50zM0-30v37" fill="none" stroke="#0c5364" stroke-width="7"/><text y="110" font-size="21" font-weight="700" fill="#062b38">4 · SHORT LOOP</text></g><g transform="translate(1400 665)"><circle r="72" fill="#fff2c9" stroke="#bf7b20" stroke-width="6"/><path d="M-32-24h64v48h-64zM-18 35h36" fill="none" stroke="#8a5415" stroke-width="7"/><text y="110" font-size="21" font-weight="700" fill="#54340f">5 · OUT + WASH</text></g></g>
  <text x="800" y="858" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#e7f5f3">Recover before the deadline leaves room for the exit wash</text>
