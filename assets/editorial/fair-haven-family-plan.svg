<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Little Sodus Bay family boating plan</title><desc id="d">A conceptual plan from Fair Haven Beach State Park through an inside-bay loop, early turn, retrieval and optional Lake Ontario decision gate.</desc><rect width="1600" height="900" fill="#e9f3ee"/><path d="M0 0H1600V250Q1390 300 1240 245T890 250 520 235 0 275Z" fill="#8fc6a7"/><path d="M0 280Q310 220 570 320T1080 285 1600 330V820H0Z" fill="#2f94ad"/><path d="M0 380Q330 320 600 405T1080 390 1600 420" fill="none" stroke="#a9ecf2" stroke-width="10" opacity=".7"/><text x="70" y="90" fill="#073044" font-family="Arial,sans-serif" font-size="55" font-weight="700">LITTLE SODUS BAY: MAKE THE BAY THE DAY</text><text x="72" y="142" fill="#245c68" font-family="Arial,sans-serif" font-size="27">Lake Ontario is a separate gate—not the default route.</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="230" cy="545" r="105" fill="#f0ad4e" stroke="#fff" stroke-width="7"/><text x="230" y="530" fill="#073044" font-size="27" font-weight="700">FAIR HAVEN</text><text x="230" y="566" fill="#073044" font-size="27" font-weight="700">LAUNCH</text><path d="M340 545 C520 420 760 420 900 540 S1180 670 1280 545" fill="none" stroke="#fff" stroke-width="13" stroke-dasharray="24 16"/><circle cx="650" cy="458" r="78" fill="#d7efe1" stroke="#fff" stroke-width="6"/><text x="650" y="448" fill="#073044" font-size="25" font-weight="700">SHAKEDOWN</text><text x="650" y="480" fill="#073044" font-size="23">inside bay</text><circle cx="1020" cy="600" r="78" fill="#f6d39c" stroke="#fff" stroke-width="6"/><text x="1020" y="590" fill="#073044" font-size="25" font-weight="700">EARLY TURN</text><text x="1020" y="622" fill="#073044" font-size="23">keep margin</text><rect x="1280" y="455" width="245" height="180" rx="30" fill="#073044" stroke="#fff" stroke-width="6"/><text x="1402" y="510" fill="#fff" font-size="25" font-weight="700">LAKE ONTARIO?</text><text x="1402" y="553" fill="#8ed7e5" font-size="22">new forecast</text><text x="1402" y="586" fill="#8ed7e5" font-size="22">new capability check</text></g><rect x="115" y="745" width="1370" height="95" rx="24" fill="#fff" opacity=".94"/><text x="800" y="800" text-anchor="middle" fill="#073044" font-family="Arial,sans-serif" font-size="31" font-weight="700">LOOP • RETURN • CLEAN + DRAIN • BEACH OR PICNIC</text></svg>
