<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Marine carbon monoxide defense in depth</title><desc id="d">Four layers showing exhaust source control, ventilation and separation, marine alarms, and immediate emergency response.</desc><rect width="1600" height="900" fill="#071f30"/><text x="70" y="100" fill="#fff" font-family="Arial,sans-serif" font-size="55" font-weight="700">CARBON MONOXIDE: DEFENSE IN DEPTH</text><text x="72" y="152" fill="#8ed7e5" font-family="Arial,sans-serif" font-size="27">The alarm is the last warning layer—not permission to stay in exposure.</text><g font-family="Arial,sans-serif"><rect x="80" y="245" width="330" height="430" rx="28" fill="#b93b3b"/><circle cx="245" cy="340" r="68" fill="#fff" opacity=".94"/><path d="M205 340h80M245 300v80" stroke="#b93b3b" stroke-width="18"/><text x="245" y="445" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">1. CONTROL</text><text x="245" y="500" text-anchor="middle" fill="#fff" font-size="24">maintain engines</text><text x="245" y="536" text-anchor="middle" fill="#fff" font-size="24">manage generator</text><text x="245" y="572" text-anchor="middle" fill="#fff" font-size="24">keep clear of exhaust</text><rect x="450" y="245" width="330" height="430" rx="28" fill="#246b78"/><path d="M535 320h160M535 355h160M535 390h160" stroke="#fff" stroke-width="15" stroke-linecap="round"/><text x="615" y="445" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">2. SEPARATE</text><text x="615" y="500" text-anchor="middle" fill="#fff" font-size="24">fresh air</text><text x="615" y="536" text-anchor="middle" fill="#fff" font-size="24">openings checked</text><text x="615" y="572" text-anchor="middle" fill="#fff" font-size="24">neighbors considered</text><rect x="820" y="245" width="330" height="430" rx="28" fill="#e3a648"/><circle cx="985" cy="348" r="75" fill="#fff"/><text x="985" y="365" text-anchor="middle" fill="#071f30" font-size="44" font-weight="700">CO</text><text x="985" y="445" text-anchor="middle" fill="#071f30" font-size="32" font-weight="700">3. DETECT</text><text x="985" y="500" text-anchor="middle" fill="#071f30" font-size="24">marine alarm</text><text x="985" y="536" text-anchor="middle" fill="#071f30" font-size="24">test + fault signals</text><text x="985" y="572" text-anchor="middle" fill="#071f30" font-size="24">replace at end of life</text><rect x="1190" y="245" width="330" height="430" rx="28" fill="#d9edf1"/><path d="M1280 390l75-120 75 120h-45v45h-60v-45z" fill="#b93b3b"/><text x="1355" y="445" text-anchor="middle" fill="#071f30" font-size="32" font-weight="700">4. ACT</text><text x="1355" y="500" text-anchor="middle" fill="#071f30" font-size="24">fresh air now</text><text x="1355" y="536" text-anchor="middle" fill="#071f30" font-size="24">call emergency help</text><text x="1355" y="572" text-anchor="middle" fill="#071f30" font-size="24">do not resume</text></g><rect x="80" y="750" width="1440" height="80" rx="20" fill="#fff" opacity=".95"/><text x="800" y="801" text-anchor="middle" fill="#071f30" font-family="Arial,sans-serif" font-size="28" font-weight="700">HEADACHE • DIZZINESS • WEAKNESS • NAUSEA • CONFUSION = POSSIBLE CO</text></svg>
