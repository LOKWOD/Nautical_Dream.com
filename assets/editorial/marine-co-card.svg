<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Marine carbon monoxide alarm guide card</title><desc id="d">A marine CO alarm beside a four-step source-control and emergency-response sequence.</desc><rect width="1200" height="900" fill="#071f30"/><text x="65" y="100" fill="#fff" font-family="Arial,sans-serif" font-size="55" font-weight="700">MARINE CO</text><text x="68" y="155" fill="#8ed7e5" font-family="Arial,sans-serif" font-size="29">Control the source. Keep the alarm.</text><circle cx="310" cy="465" r="180" fill="#f1f5f6" stroke="#e4a74a" stroke-width="18"/><circle cx="310" cy="465" r="115" fill="#dce8eb"/><text x="310" y="485" text-anchor="middle" fill="#071f30" font-family="Arial,sans-serif" font-size="80" font-weight="700">CO</text><g font-family="Arial,sans-serif" font-size="30" font-weight="700"><rect x="575" y="270" width="500" height="82" rx="18" fill="#b93b3b"/><text x="610" y="322" fill="#fff">1  CONTROL EXHAUST</text><rect x="575" y="375" width="500" height="82" rx="18" fill="#246b78"/><text x="610" y="427" fill="#fff">2  VENTILATE + SEPARATE</text><rect x="575" y="480" width="500" height="82" rx="18" fill="#e4a74a"/><text x="610" y="532" fill="#071f30">3  TEST MARINE ALARMS</text><rect x="575" y="585" width="500" height="82" rx="18" fill="#d9edf1"/><text x="610" y="637" fill="#071f30">4  FRESH AIR + 911</text></g><text x="600" y="805" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">NO DETECTOR MAKES EXHAUST EXPOSURE SAFE</text></svg>
