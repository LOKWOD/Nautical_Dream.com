name: Deploy Nautical Dream static publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate daily publication from source
        run: |
          node scripts/build-publication-2026-08-21.mjs
          node scripts/build-publication-2026-08-22.mjs
          node scripts/build-publication-2026-08-23.mjs
          node scripts/build-publication-2026-08-24.mjs
          node scripts/build-publication-2026-08-25.mjs
          node scripts/build-publication-2026-08-26.mjs
          node scripts/build-publication-2026-08-27.mjs
          node scripts/build-publication-2026-08-29.mjs
          node scripts/build-publication-2026-08-30.mjs
          node scripts/build-publication-2026-09-01.mjs
          node scripts/build-publication-2026-09-02.mjs
          node scripts/build-publication-2026-09-03.mjs
          node scripts/build-publication-2026-09-04.mjs
          node scripts/build-image-credits.mjs
          node scripts/inject-affiliate-links.mjs .
      - name: Validate the published static site
        run: |
          node scripts/audit-hub-images.mjs
          node scripts/audit-daily-2026-08-30.mjs
          node scripts/audit-daily-2026-09-01.mjs
          node scripts/audit-daily-2026-09-02.mjs
          node scripts/audit-daily-2026-09-03.mjs
          node scripts/audit-daily-2026-09-04.mjs
          node scripts/audit-static-site.mjs
      - name: Assemble GitHub Pages artifact
        run: |
          mkdir _site
          cp -- *.html styles.css robots.txt sitemap.xml CNAME _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
