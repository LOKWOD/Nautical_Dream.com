name: Static site audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate authority pages
        run: npm run build:authority
      - name: Inject Cloudflare Web Analytics
        run: node scripts/inject-cloudflare-analytics.mjs
      - name: Validate links, metadata, images and analytics
        run: npm run audit:site
